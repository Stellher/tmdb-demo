name: Go anime metadata tests and live ReZero/BSD
on:
  push:
    branches: [feature/go-anime-metadata, main]
    paths:
      - 'anime-metadata-go/**'
      - '.github/workflows/go-anime-metadata.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  go-integration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: anime-metadata-go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: anime-metadata-go/go.mod
      - name: Download Go dependencies and test
        run: |
          go mod tidy
          go test -v ./...
          go vet ./...
          go build -o anime-metadata-go .
      - name: Reuse disposable TMDB demo test token
        shell: bash
        run: |
          TOKEN="$(python3 - <<'PY'
          from pathlib import Path
          import re
          data=Path('../app/build.gradle.kts').read_text()
          match=re.search(r'val tmdbReadToken\s*=\s*"([^"]+)"',data)
          if match: print(match.group(1))
          PY
          )"
          if [[ -z "$TOKEN" ]]; then echo 'Missing demo TMDB test token'; exit 1; fi
          echo "::add-mask::$TOKEN"
          echo "TMDB_READ_TOKEN=$TOKEN" >> "$GITHUB_ENV"
      - name: Start zero-database API
        shell: bash
        run: |
          ./anime-metadata-go > /tmp/anime-metadata-server.log 2>&1 &
          echo "$!" > /tmp/anime-metadata-server.pid
          for i in $(seq 1 70); do
            if curl -fsS http://127.0.0.1:8080/health > /tmp/health.json; then break; fi
            sleep 3
          done
          echo "MAPPINGS:"
          jq -c '{mappings,tmdbConfigured}' /tmp/health.json
          jq -e '.mappings.loaded == true and .tmdbConfigured == true' /tmp/health.json
      - name: Real AniList search and ReZero/Bungo episode requests
        shell: bash
        run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.error
          base="http://127.0.0.1:8080"
          routes=[
           "/api/anime/search?q=Re%3AZero",
           "/api/anime/21355",
           "/api/anime/108632",
           "/api/anime/119661",
           "/api/anime/163134",
           "/api/anime/189046",
           "/api/anime/tmdb/65942",
           "/api/anime/tmdb/65931",
          ]
          for route in routes:
              try:
                  with urllib.request.urlopen(base+route,timeout=105) as response:
                      data=json.load(response)
                      if route.startswith("/api/anime/tmdb/"):
                          entries=data.get("entries",[])
                          print("SERIES_REPORT",json.dumps({"route":route,"http":response.status,
                            "totalEntries":len(entries),"totalEpisodes":data.get("totalEpisodes"),
                            "totalStills":data.get("totalStills"),
                            "unresolved":data.get("unresolvedAniListIds"),
                            "entries":[{"anilistId":e.get("anilistId"),"title":e.get("title"),
                                        "count":e.get("count"),"stills":e.get("stills"),
                                        "source":e.get("mappingSource"),
                                        "verifiedCount":e.get("verifiedCount"),
                                        "first":(e.get("episodes") or [{}])[0]} for e in entries]},ensure_ascii=False)[:10000],flush=True)
                      elif route.startswith("/api/anime/search"):
                          print("SEARCH_REPORT",json.dumps({"http":response.status,"count":data.get("count"),
                            "first":data.get("results",[])[:5]},ensure_ascii=False)[:1600],flush=True)
                      else:
                          episodes=data.get("episodes",[])
                          print("EPISODE_REPORT",json.dumps({"route":route,"http":response.status,
                            "title":data.get("title"),"source":data.get("mappingSource"),
                            "count":data.get("count"),"stills":data.get("stills"),
                            "verifiedCount":data.get("verifiedCount"),"warnings":data.get("warnings"),
                            "first":episodes[0] if episodes else None,"last":episodes[-1] if episodes else None},ensure_ascii=False)[:2700],flush=True)
              except Exception as error:
                  print("REQUEST_FAILED",route,str(error)[:400],flush=True)
                  # Initial exploratory pass: do not stop subsequent route tests.
          PY
      - name: Assert exact ReZero and Bungo main-season episode mapping
        shell: bash
        run: |
          python3 - <<'PY'
          import json,urllib.request
          base="http://127.0.0.1:8080/api/anime/tmdb/"
          expectations={
              65942:{21355:(25,1),108632:(13,26),119661:(12,39),163134:(16,51),189046:(19,67)},
              65931:{21311:(12,1),21679:(12,13),103223:(12,25),141249:(13,37),163263:(11,50)},
          }
          for tmdb,requirements in expectations.items():
              with urllib.request.urlopen(base+str(tmdb),timeout=110) as response:
                  data=json.load(response)
              entries={e["anilistId"]:e for e in data["entries"]}
              for aid,(count,start) in requirements.items():
                  assert aid in entries,(tmdb,aid,"missing title")
                  entry=entries[aid]
                  assert entry["count"]==count,(tmdb,aid,"episode mismatch",entry["count"])
                  assert entry["stills"]==count,(tmdb,aid,"missing episode images")
                  assert entry["episodes"][0]["tmdbEpisodeNumber"]==start,(tmdb,aid,"wrong TMDB episode offset")
                  assert entry["verifiedCount"],(tmdb,aid,"AniList count does not match")
              first_five=[e["anilistId"] for e in data["entries"] if e["format"]=="TV"][:5]
              assert first_five==list(requirements),(tmdb,"wrong chronological season order",first_five)
              print("VERIFIED",{"tmdbId":tmdb,"mainSeasons":first_five,
                  "mainEpisodes":sum(v[0] for v in requirements.values()),"allStillsPresent":True})
          with urllib.request.urlopen(base+"65931",timeout=110) as response:
              bungo=json.load(response)
          ova=next(e for e in bungo["entries"] if e["anilistId"]==21791)
          assert ova["count"]==1 and ova["episodes"][0]["tmdbSeason"]==0
          print("VERIFIED special",{"id":21791,"season":0,"episode":1})
          PY
      - name: Dump startup errors
        if: always()
        shell: bash
        run: |
          tail -n 30 /tmp/anime-metadata-server.log || true
          if [[ -f /tmp/anime-metadata-server.pid ]]; then kill "$(cat /tmp/anime-metadata-server.pid)" || true; fi
