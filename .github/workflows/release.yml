name: Android release APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Generate temporary demo signing key
        run: |
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/demo-release.jks" -storepass demo-store-password -alias demo -keypass demo-store-password -keyalg RSA -keysize 3072 -validity 3650 -dname "CN=TMDB Demo,O=Demo,C=US"
          echo "DEMO_KEYSTORE_PATH=$RUNNER_TEMP/demo-release.jks" >> "$GITHUB_ENV"
          echo "DEMO_KEYSTORE_PASSWORD=demo-store-password" >> "$GITHUB_ENV"
          echo "DEMO_KEY_ALIAS=demo" >> "$GITHUB_ENV"
          echo "DEMO_KEY_PASSWORD=demo-store-password" >> "$GITHUB_ENV"
      - name: Build signed release demo
        env:
          TMDB_READ_TOKEN: ${{ secrets.TMDB_READ_TOKEN }}
        run: gradle :app:assembleRelease --stacktrace
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: tmdb-demo-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
