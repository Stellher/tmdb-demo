name: Android release APK
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: android-release-main
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 36 using runner SDK
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build signed release APK (built-in test token)
        run: ./gradlew :core:model:test :app:assembleRelease --stacktrace --no-daemon
      - name: Verify stable demo signature and optimized APK
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}/build-tools/36.0.0/apksigner"
          test -f "$APK"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee signing-report.txt
          grep -qi "1db79b853e9cecda97c2ee2a7908a5366e735cbde432ce19052c07b8c34c4df6" signing-report.txt
          echo "Verified expected fixed signing certificate"
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: tmdb-demo-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
      - name: Publish downloadable demo APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/tmdb-demo-release.apk
          gh release create "demo-build-${{ github.run_number }}" dist/tmdb-demo-release.apk \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "TMDB Demo APK build ${{ github.run_number }}" \
            --notes "Automatically compiled Android release demo APK." \
            --prerelease
