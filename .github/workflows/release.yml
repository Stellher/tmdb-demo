name: Android release APK
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: android-release-main
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 36 using runner SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Generate temporary demo signing key
        run: |
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/demo-release.jks" -storepass demo-store-password -alias demo -keypass demo-store-password -keyalg RSA -keysize 3072 -validity 3650 -dname "CN=TMDB Demo,O=Demo,C=US"
          echo "DEMO_KEYSTORE_PATH=$RUNNER_TEMP/demo-release.jks" >> "$GITHUB_ENV"
          echo "DEMO_KEYSTORE_PASSWORD=demo-store-password" >> "$GITHUB_ENV"
          echo "DEMO_KEY_ALIAS=demo" >> "$GITHUB_ENV"
          echo "DEMO_KEY_PASSWORD=demo-store-password" >> "$GITHUB_ENV"
      - name: Build signed release APK (built-in test token)
        run: ./gradlew :core:model:test :app:assembleRelease --stacktrace --no-daemon
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: tmdb-demo-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
      - name: Publish downloadable demo APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/tmdb-demo-release.apk
          gh release create "demo-build-${{ github.run_number }}" dist/tmdb-demo-release.apk \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "TMDB Demo APK build ${{ github.run_number }}" \
            --notes "Automatically compiled Android release demo APK." \
            --prerelease
