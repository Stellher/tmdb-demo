name: Probe Bungo Stray Dogs anime series using romanized and Japanese queries
on:
  push:
    branches: [verification/aiometadata-live]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect-mal:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch per-season MAL results and their episode stills
        run: |
          python3 - <<'PY'
          import json,urllib.request,urllib.parse
          root="https://aiometadata.elfhosted.com/stremio/5d428e69-5edf-413b-979b-8b34c9078c26"
          def get(url):
              with urllib.request.urlopen(urllib.request.Request(url,headers={"User-Agent":"Sparkle-Demo-season-lookup/1.0"}),timeout=40) as r:return r.status,json.load(r)
          queries=["Bungou Stray Dogs","Bungou Stray Dogs 2nd Season","文豪ストレイドッグス","Bungo Stray Dogs 4th Season"]
          done=set()
          for q in queries:
              url=root+"/catalog/anime.series/search.anime_series/search="+urllib.parse.quote(q,safe="")+".json"
              try:
                  code,response=get(url)
                  arr=response.get("metas",[])
                  print("MAL_SEARCH",json.dumps({"query":q,"status":code,"count":len(arr),"results":[{"id":x.get("id"),"name":x.get("name")} for x in arr[:15]]},ensure_ascii=False),flush=True)
                  for item in arr:
                      mid=item.get("id",""); name=item.get("name","")
                      if mid in done or not (mid.startswith("mal:") and ("Bungo" in name or "Bungou" in name or "文豪" in name)):continue
                      if len(done)>=9:break
                      done.add(mid)
                      st,detail=get(root+"/meta/anime.series/"+mid+".json")
                      m=detail.get("meta",{});videos=m.get("videos") or []
                      print("MAL_META",json.dumps({"id":mid,"status":st,"name":m.get("name"),"tmdbId":m.get("_tmdbId"),
                          "video_count":len(videos),"season_counts":{str(s):sum(1 for e in videos if e.get("season")==s) for s in set(e.get("season") for e in videos)},
                          "episode_one":[{k:e.get(k) for k in ["title","id","season","episode","thumbnail","released"]} for e in videos[:1]]},ensure_ascii=False),flush=True)
              except Exception as exc:print("ERR",q,str(exc)[:300],flush=True)
          PY
