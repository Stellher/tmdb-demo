name: Compare Bungo seasons via TVDB and inspect first-episode stills
on:
  push:
    branches: [verification/aiometadata-live]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect-tvdb:
    runs-on: ubuntu-latest
    steps:
      - name: Compare TVDB season mapping to existing TMDB metadata
        shell: bash
        run: |
          python3 - <<'PY'
          import json,urllib.request,urllib.parse,urllib.error,secrets,collections
          host="https://aiometadata.elfhosted.com"
          old=host+"/stremio/5d428e69-5edf-413b-979b-8b34c9078c26"
          def get(u):
              try:
                  request=urllib.request.Request(u,headers={"User-Agent":"Sparkle-Metadata-season-evaluation/1.0","Accept":"application/json"})
                  with urllib.request.urlopen(request,timeout=38) as r: return r.status,json.load(r)
              except Exception as exc:
                  print("ERROR",str(exc)[:270],u,flush=True)
                  return 0,{}
          def post(u,data):
              req=urllib.request.Request(u,headers={"Content-Type":"application/json","Accept":"application/json","User-Agent":"Sparkle-Metadata-season-evaluation/1.0"},
                  data=json.dumps(data).encode(),method="POST")
              try:
                  with urllib.request.urlopen(req,timeout=45) as r: return r.status,json.load(r)
              except urllib.error.HTTPError as e:
                  print("POST_ERR",e.code,e.read(900).decode(errors="replace"),flush=True);return e.code,{}
              except Exception as e:
                  print("POST_ERR",str(e),flush=True);return 0,{}
          config={
              "language":"zh-CN","addonName":"Sparkle Metadata TVDB Comparison",
              "includeAdult":False,"sfw":True,"searchEnabled":True,"catalogModeOnly":False,
              "hideStremioCatalogs":True,
              "providers":{"movie":"tmdb","series":"tvdb","anime":"mal","anime_id_provider":"imdb","forceAnimeForDetectedImdb":False},
              "artProviders":{"movie":{"poster":"meta","background":"meta","logo":"meta"},
                  "series":{"poster":"meta","background":"meta","logo":"meta"},
                  "anime":{"poster":"meta","background":"meta","logo":"meta"},
                  "englishArtOnly":False,"originalLangFallback":False},
              "mal":{"skipFiller":False,"skipRecap":False,"allowEpisodeMarking":False},
              "tvdbSeasonType":"default","tvdbNormalizeYearSeasons":False,
              "tmdb":{"scrapeImdb":False},"apiKeys":{"tmdb":"","tvdb":"","fanart":"","rpdb":"","mdblist":""},
              "catalogs":[],"search":{"enabled":True,"ai_enabled":False,
                  "providers":{"movie":"tmdb.search","series":"tvdb.search",
                      "anime_series":"mal.search.series","anime_movie":"mal.search.movie"},
                  "engineEnabled":{"tmdb.search":True,"tvdb.search":True,"mal.search.series":True,"mal.search.movie":True},
                  "searchOrder":["movie","series","anime_series","anime_movie"]}
          }
          st,x=post(host+"/api/config/save",{"config":config,"password":secrets.token_urlsafe(28)})
          print("SAVE",st,"URL",x.get("installUrl"),flush=True)
          if st!=200: raise SystemExit(1)
          new=x["installUrl"].removesuffix("/manifest.json")
          st,manifest=get(new+"/manifest.json")
          print("MANIFEST",st,[(v.get("id"),v.get("type")) for v in manifest.get("catalogs",[]) if v.get("id","").startswith("search.")],flush=True)
          st,res=get(new+"/catalog/series/search.series/search="+urllib.parse.quote("文豪野犬")+".json")
          print("TVDB_SEARCH",st,[{"id":v.get("id"),"name":v.get("name")} for v in res.get("metas",[])[:9]],flush=True)
          for label,root in [("TMDB",old),("TVDB",new)]:
              st,r=get(root+"/meta/series/tt5679720.json")
              m=r.get("meta",{})
              eps=m.get("videos") or []
              groups=collections.defaultdict(list)
              for e in eps:groups[e.get("season")].append(e)
              print("SERIES",json.dumps({"provider":label,"status":st,"name":m.get("name"),
                  "tmdbId":m.get("_tmdbId"),"tvdbId":m.get("_tvdbId"),"videos":len(eps),
                  "seasons":[{"s":s,"n":len(items),"still_count":sum(bool(e.get("thumbnail")) for e in items),
                              "sample":[{"episode":e.get("episode"),"title":e.get("title"),
                                         "release":e.get("released"),"thumbnail":e.get("thumbnail")}
                                        for e in items[:2]]}
                             for s,items in sorted(groups.items(),key=lambda v:v[0] if isinstance(v[0],int) else 999)]},ensure_ascii=False)[:22000],flush=True)
          # Global episode ranges of 60-item TMDB "season 1" represent anime seasons.
          st,r=get(old+"/meta/series/tt5679720.json")
          eps=[v for v in r.get("meta",{}).get("videos",[]) if v.get("season")==1]
          for start,end,season in [(1,12,1),(13,24,2),(25,36,3),(37,49,4),(50,60,5)]:
              if len(eps)>=end:
                  e=eps[start-1];f=eps[end-1]
                  print("TMDB_GLOBAL_SEGMENT",json.dumps({"season":season,"episode_global_range":[start,end],
                    "first_name":e.get("title"),"first_date":e.get("released"),
                    "first_thumbnail":e.get("thumbnail"),"last_date":f.get("released"),
                    "last_thumbnail":f.get("thumbnail")},ensure_ascii=False),flush=True)
          PY
