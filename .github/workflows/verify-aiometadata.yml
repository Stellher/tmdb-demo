name: Verify and create AIO Metadata demo configuration
on:
  push:
    branches: [verification/aiometadata-live]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  create-config:
    runs-on: ubuntu-latest
    steps:
      - name: Provision one temporary AIOMetadata config and probe metadata APIs
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, secrets, urllib.parse, urllib.request, urllib.error
          base = "https://aiometadata.elfhosted.com"
          def call(url, obj=None, timeout=20):
              body = None if obj is None else json.dumps(obj).encode()
              req = urllib.request.Request(url, data=body,
                  headers={"Accept":"application/json", "User-Agent":"Sparkle-TMDB-demo-metadata-validation/1.0",
                           **({"Content-Type":"application/json"} if body else {})},
                  method="POST" if body else "GET")
              try:
                  with urllib.request.urlopen(req, timeout=timeout) as response:
                      data = response.read(500000)
                      try: payload = json.loads(data)
                      except: payload = {"non_json":data[:200].decode(errors="replace")}
                      return response.status, payload
              except urllib.error.HTTPError as e:
                  print(f"HTTP ERROR {e.code} at {url.split('?')[0]}")
                  try: print(e.read(900).decode(errors="replace"))
                  except: pass
                  return e.code, {}
              except Exception as e:
                  print("REQUEST FAILED: "+type(e).__name__+": "+str(e)[:200])
                  return 0, {}
          status, server = call(base+"/api/config")
          print("INSTANCE_CONFIG http="+str(status))
          print("BUILTIN_KEYS "+json.dumps({k:server.get(k) for k in ["hasBuiltInTmdb","hasBuiltInTvdb","jikanEnabled","anilistRequiresAuth"]}))
          if status!=200 or not server.get("hasBuiltInTmdb"):
              print("SKIP: instance has no built-in TMDB API key")
              raise SystemExit(1)
          # Password generated only on this CI runner. It is not stored or printed.
          password=secrets.token_urlsafe(32)
          defaults = {
              "language":"zh-CN", "addonName":"Sparkle Metadata Test",
              "includeAdult":False, "sfw":True, "searchEnabled":True,
              "catalogModeOnly":False,"hideStremioCatalogs":True,
              "castCount":8, "usePosterProxy":False,
              "providers":{"movie":"tmdb","series":"tmdb","anime":"mal",
                           "anime_id_provider":"imdb","forceAnimeForDetectedImdb":False},
              "artProviders":{
                  "movie":{"poster":"meta","background":"meta","logo":"meta"},
                  "series":{"poster":"meta","background":"meta","logo":"meta"},
                  "anime":{"poster":"meta","background":"meta","logo":"meta"},
                  "englishArtOnly":False,"originalLangFallback":False
              },
              "mal":{"skipFiller":False,"skipRecap":False,"allowEpisodeMarking":False},
              "tmdb":{"scrapeImdb":False,"forceLatinCastNames":False},
              "apiKeys":{"tmdb":"","tvdb":"","fanart":"","rpdb":"","mdblist":"","gemini":""},
              "catalogs":[],
              "search":{
                  "enabled":True,"ai_enabled":False,
                  "providers":{"movie":"tmdb.search","series":"tmdb.search",
                               "anime_series":"mal.search.series","anime_movie":"mal.search.movie"},
                  "engineEnabled":{
                      "tmdb.search":True,"mal.search.series":True,"mal.search.movie":True,
                      "tvdb.collections.search":False,"gemini.search":False,
                      "people_search_movie":False,"people_search_series":False
                  },
                  "searchOrder":["movie","series","anime_series","anime_movie"]
              }
          }
          status, saved = call(base+"/api/config/save",
                               {"config":defaults, "password":password},timeout=28)
          print("SAVED_STATUS",status)
          if status!=200 or not saved.get("installUrl"):
              print("CONFIG_SAVE_FAILED " + json.dumps(saved, ensure_ascii=False)[:500])
              raise SystemExit(1)
          url=saved["installUrl"]
          print("MANIFEST_URL "+url)
          status, manifest=call(url, timeout=30)
          print("MANIFEST_STATUS",status)
          catalogs=manifest.get("catalogs",[])
          searches=[{"id":x.get("id"),"type":x.get("type"),"name":x.get("name")} for x in catalogs if x.get("id","").startswith("search.")]
          print("MANIFEST_SUMMARY "+json.dumps({"name":manifest.get("name"),"types":manifest.get("types"),
                 "resources":manifest.get("resources"),"searches":searches},ensure_ascii=False)[:2500])
          if status!=200 or not searches: raise SystemExit(1)
          root=url.rsplit("/manifest.json",1)[0]
          for kind,text in [("movie","千与千寻"),("series","辉夜大小姐"),("anime.series","辉夜大小姐")]:
              choices=[i for i in searches if i["type"]==kind]
              if not choices: print("SEARCH_SKIPPED type="+kind); continue
              c=choices[0]
              q=urllib.parse.quote(text, safe="")
              search_url=root+"/catalog/"+kind+"/"+c["id"]+"/search="+q+".json"
              status,response=call(search_url,timeout=32)
              metas=response.get("metas",[])
              summary=[{"id":x.get("id"),"name":x.get("name"),"type":x.get("type"),"poster":bool(x.get("poster"))}
                       for x in metas[:3]]
              print("SEARCH_PROBE "+json.dumps({"kind":kind,"query":text,"status":status,
                  "results":len(metas),"sample":summary},ensure_ascii=False)[:2000])
              if status==200 and metas and kind in ("movie","series"):
                  mid=urllib.parse.quote(str(metas[0]["id"]),safe=":")
                  st,meta=call(root+"/meta/"+kind+"/"+mid+".json",timeout=28)
                  value=meta.get("meta",{})
                  print("META_PROBE "+json.dumps({"kind":kind,"status":st,"id":value.get("id"),
                         "name":value.get("name"),"keys":sorted(value.keys())[:35],
                         "videos":len(value.get("videos",[]) or [])},ensure_ascii=False)[:1700])
          PY
