name: Inspect Bungo Stray Dogs AIOMetadata seasons and stills
on:
  push:
    branches: [verification/aiometadata-live]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Bungo Stray Dogs searches, TMDB mapping and episode posters
        shell: bash
        run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.parse, collections, urllib.error, time
          base="https://aiometadata.elfhosted.com/stremio/5d428e69-5edf-413b-979b-8b34c9078c26"
          def get(url):
              req=urllib.request.Request(url,headers={"User-Agent":"TMDB-Demo-metadata-study/1.0","Accept":"application/json"})
              try:
                  with urllib.request.urlopen(req, timeout=35) as x:
                      data=json.load(x); return x.status,data
              except Exception as e:
                  print("ERR",url,type(e).__name__,str(e)[:280],flush=True);return 0,{}
          def safeitem(i):
              return {k:i.get(k) for k in ["id","name","type","releaseInfo","poster","year"] if i.get(k) is not None}
          found={}
          for kind,cat in [("series","search.series"),("anime.series","search.anime_series"),("movie","search.movie"),("anime.movie","search.anime_movie")]:
              q=urllib.parse.quote("文豪野犬",safe="")
              url=f"{base}/catalog/{kind}/{cat}/search={q}.json"
              code,response=get(url)
              items=response.get("metas",[])
              print("SEARCH",json.dumps({"kind":kind,"url":url,"status":code,"total":len(items),
                                        "items":[safeitem(i) for i in items[:12]]},ensure_ascii=False),flush=True)
              found[kind]=items
          # Test the first 2 relevant series plus one relevant movie; verify actual results, don't invent IDs.
          for kind in ["series","anime.series","movie","anime.movie"]:
              items=found.get(kind,[])
              matching=[i for i in items if "文豪" in i.get("name","") or "Bungo" in i.get("name","") or "Bungou" in i.get("name","")]
              for i in matching[:2 if kind in ("series","anime.series") else 1]:
                  mediaid=i.get("id","")
                  url=f"{base}/meta/{kind}/{urllib.parse.quote(mediaid,safe=':')}.json"
                  code,response=get(url)
                  obj=response.get("meta",{})
                  episodes=obj.get("videos") or []
                  byseason=collections.defaultdict(list)
                  for episode in episodes:
                      season=episode.get("season")
                      byseason[str(season)].append(episode)
                  print("META_SUMMARY",json.dumps({
                      "kind":kind,"url":url,"status":code,
                      "name":obj.get("name"),"id":obj.get("id"),
                      "poster":obj.get("poster"),"background":obj.get("background"),
                      "tmdb_id":obj.get("_tmdbId"),"tvdb_id":obj.get("_tvdbId"),
                      "total_videos":len(episodes),
                      "video_keys":list(episodes[0].keys()) if episodes else [],
                      "seasons":[{"season":s,"total":len(es),
                                  "has_thumbnail":sum(bool(e.get("thumbnail")) for e in es),
                                  "has_image":sum(bool(e.get("image")) for e in es),
                                  "number_first":es[0].get("episode"),"number_last":es[-1].get("episode")}
                                  for s,es in sorted(byseason.items(),key=lambda x:(int(x[0]) if x[0].lstrip('-').isdigit() else 9999))],
                      "episode_examples":[
                          {"season":s,"episodes":[{k:e.get(k) for k in ["id","season","episode","title","name","released","thumbnail","image","description"] if k in e}
                                                  for e in es[:3]]}
                          for s,es in sorted(byseason.items(),key=lambda x:(int(x[0]) if x[0].lstrip('-').isdigit() else 9999))]
                      },ensure_ascii=False)[:19000],flush=True)
          PY
