name: Probe AniCh search backend for ReZero
on:
  push:
    branches: [verification/aiometadata-live]
permissions:
  contents: read
jobs:
  anich:
    runs-on: ubuntu-latest
    steps:
      - name: Check public AniCh /bangumi/search and episode endpoints
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error,urllib.parse
          q=urllib.parse.quote("Re:从零开始的异世界生活",safe="")
          for base in ["https://api.emmmm.eu.org","https://ani.emmmm.eu.org"]:
              for path in ["/bangumi/search?keyword="+q+"&skip=0","/bangumi/search?keyword=Re%3AZero&skip=0"]:
                  url=base+path
                  request=urllib.request.Request(url,headers={"User-Agent":"xs Android 1.0.0","Accept":"application/octet-stream"})
                  try:
                      with urllib.request.urlopen(request,timeout=14) as response:
                          raw=response.read(500000)
                          print("SEARCH_STATUS",{"host":base,"query":path.split("keyword=")[1].split("&")[0],
                              "status":response.status,"ctype":response.headers.get("content-type"),
                              "bytes":len(raw),"first_bytes":raw[:28].hex()},flush=True)
                  except urllib.error.HTTPError as ex:
                      print("SEARCH_ERROR",{"host":base,"code":ex.code,"text":ex.read(160).decode(errors="replace")},flush=True)
                  except Exception as ex:print("SEARCH_ERROR",base,str(ex)[:140],flush=True)
          PY
