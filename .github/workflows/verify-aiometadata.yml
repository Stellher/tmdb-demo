name: Check alternate TVDB episode order for five Bungo seasons
on:
  push:
    branches: [verification/aiometadata-live]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect-alt:
    runs-on: ubuntu-latest
    steps:
      - name: Try TVDB alternate season order for 文豪野犬
        run: |
          python3 - <<'PY'
          import json,urllib.request,urllib.error,secrets,collections
          host="https://aiometadata.elfhosted.com"
          def api(url,payload=None):
              q=urllib.request.Request(url,headers={"User-Agent":"Sparkle-Metadata-episode-order-test/1.0",
                  "Content-Type":"application/json"},data=json.dumps(payload).encode() if payload is not None else None,
                  method="POST" if payload is not None else "GET")
              try:
                  with urllib.request.urlopen(q,timeout=45) as r:return r.status,json.load(r)
              except urllib.error.HTTPError as e:
                  print("HTTP_ERR",e.code,e.read(800).decode(errors="replace"));return e.code,{}
              except Exception as e:print("ERROR",str(e)[:200]);return 0,{}
          cfg={
              "language":"zh-CN","addonName":"Sparkle Metadata TVDB Alternate",
              "includeAdult":False,"searchEnabled":True,"catalogModeOnly":False,"hideStremioCatalogs":True,
              "providers":{"movie":"tmdb","series":"tvdb","anime":"mal","anime_id_provider":"imdb","forceAnimeForDetectedImdb":False},
              "tvdbSeasonType":"alternate","tvdbEpisodeOrders":{"tvdb:305075":"alternate"},
              "tvdbNormalizeYearSeasons":True,
              "artProviders":{"movie":{"poster":"meta","background":"meta","logo":"meta"},
                  "series":{"poster":"meta","background":"meta","logo":"meta"},
                  "anime":{"poster":"meta","background":"meta","logo":"meta"}},
              "apiKeys":{"tmdb":"","tvdb":"","fanart":"","rpdb":"","mdblist":""},
              "catalogs":[],"search":{"enabled":True,"ai_enabled":False,
                  "providers":{"movie":"tmdb.search","series":"tvdb.search",
                    "anime_series":"mal.search.series","anime_movie":"mal.search.movie"},
                  "engineEnabled":{"tvdb.search":True,"tmdb.search":True,"mal.search.series":True,"mal.search.movie":True}}
          }
          status,result=api(host+"/api/config/save",{"config":cfg,"password":secrets.token_urlsafe(32)})
          print("CONFIG_STATUS",status,"MANIFEST",result.get("installUrl"))
          if status!=200:raise SystemExit(1)
          base=result["installUrl"].removesuffix("/manifest.json")
          status,r=api(base+"/meta/series/tt5679720.json")
          meta=r.get("meta",{});groups=collections.defaultdict(list)
          for e in meta.get("videos",[]):groups[e.get("season")].append(e)
          print("ALTERNATE_META",json.dumps({"status":status,"name":meta.get("name"),
              "tmdb":meta.get("_tmdbId"),"tvdb":meta.get("_tvdbId"),
              "episodes":len(meta.get("videos",[])),
              "seasons":[{"season":s,"count":len(es),"stills":sum(bool(e.get("thumbnail")) for e in es),
                  "first_episode":es[0].get("episode"),"first_title":es[0].get("title"),
                  "first_still":es[0].get("thumbnail")}
                  for s,es in sorted(groups.items(),key=lambda x:x[0] if isinstance(x[0],int) else 999)]},ensure_ascii=False),flush=True)
          PY
